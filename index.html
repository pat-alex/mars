<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>متابعة التربية العملية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16211C;
    --board: #1E4638;
    --board-light: #2C5C4A;
    --paper: #F2F4EE;
    --card: #FFFFFF;
    --gold: #C98A2C;
    --brick: #B24A3C;
    --slate: #5A7688;
    --line: #DDE0D3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cairo', Tahoma, Arial, sans-serif;
    direction: rtl;
    overscroll-behavior-y: contain;
  }
  body { padding-bottom: 90px; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 16px 24px; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--board); color: #fff;
    padding: 14px 16px; text-align: center;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; margin: 0; }
  .topbar .schoolLine { font-size: 13px; opacity: .85; margin-top: 4px; }

  .entryWrap { padding: 22px 0 4px; }
  .entryWrap .lead { font-size: 14px; color: #5b6259; margin: 0 0 16px; text-align: center; }
  .choiceCard {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px; cursor: pointer; text-align: right;
  }
  .choiceCard:active { background: #FBFAF6; }
  .choiceCard .icon {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 10px;
    background: var(--board); color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .choiceCard .icon svg { width: 22px; height: 22px; }
  .choiceCard .txt strong { display: block; font-size: 15px; font-weight: 700; }
  .choiceCard .txt span { display: block; font-size: 13px; color: #5b6259; margin-top: 2px; }

  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font-family: inherit;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 1px;
  }

  button.primary {
    width: 100%; padding: 13px; margin-top: 12px;
    background: var(--board); color: #fff; border: none; border-radius: 10px;
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button.primary:active { background: var(--board-light); }
  button.ghost {
    width: 100%; padding: 11px; margin-top: 8px;
    background: transparent; color: var(--board); border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  .msg { text-align: center; font-size: 14px; font-weight: 600; color: var(--board); margin-top: 10px; }
  .error { text-align: center; font-size: 14px; font-weight: 600; color: var(--brick); margin-top: 10px; }

  .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .box summary { cursor: pointer; font-weight: 700; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .box summary::-webkit-details-marker { display: none; }
  .box summary svg { width: 18px; height: 18px; color: var(--board); }

  .studentRow { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .studentRow .name { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .pillGroup { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    flex: 1; min-width: 62px; text-align: center;
    padding: 8px 4px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  .pill.sel-حضور { background: var(--board); border-color: var(--board); color: #fff; }
  .pill.sel-غياب { background: var(--brick); border-color: var(--brick); color: #fff; }
  .pill.sel-تأخير { background: var(--gold); border-color: var(--gold); color: #fff; }
  .pill.sel-إذن { background: var(--slate); border-color: var(--slate); color: #fff; }
  .studentRow .noteInput { margin-top: 8px; font-size: 13px; padding: 8px 10px; }

  .empty { text-align: center; color: #7a8073; font-size: 14px; padding: 22px 10px; }

  .tabbar {
    position: fixed; bottom: 0; right: 0; left: 0; z-index: 20;
    display: flex; background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tabbar button {
    flex: 1; background: none; border: none; padding: 10px 4px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b9285; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .tabbar button.active { color: var(--board); }
  .tabbar button svg { width: 22px; height: 22px; }

  .tabPanel { display: none; padding-top: 14px; }
  .tabPanel.active { display: block; }
  h2.pageTitle { font-size: 16px; font-weight: 700; margin: 4px 0 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="topbar">
  <h1>متابعة التربية العملية</h1>
  <div class="schoolLine hidden" id="schoolLine"></div>
  <div class="hidden" id="switchSchoolWrap" style="margin-top:4px;">
    <a href="#" onclick="logoutSchool(); return false;" style="color:#fff; opacity:.75; font-size:12px; text-decoration:underline;">تغيير المدرسة</a>
  </div>
</div>

<div class="container">

  <div id="modeChoice" class="entryWrap">
    <p class="lead">نموذج  تجريبي للتطبيق، فى انتظار ملاحظاتكم للتطوير </p>
    <div class="choiceCard" onclick="showMode('code')">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="15" r="4"/><path d="M9.5 12.5 20 2"/><path d="M17 5l2 2"/><path d="M14 8l2 2"/></svg></div>
      <div class="txt"><strong>عندي كود مدرسة</strong><span>الدخول بكود مسجل من قبل</span></div>
    </div>
    <div class="choiceCard" onclick="showMode('new')">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div>
      <div class="txt"><strong>تسجيل مدرسة جديدة</strong><span>أول مرة أستخدم النظام</span></div>
    </div>
  </div>

  <div id="codeMode" class="entryWrap hidden">
    <label>كود المدرسة</label>
    <input type="text" id="schoolCodeInput" placeholder="مثال: 0102009" inputmode="numeric">
    <button class="primary" onclick="loginByCode()">دخول</button>
    <p class="error" id="codeError"></p>
    <button class="ghost" onclick="backToChoice()">رجوع</button>
  </div>

  <div id="newMode" class="entryWrap hidden">
    <label>الإدارة التعليمية</label>
    <select id="adminSelect"><option value="">جاري التحميل...</option></select>
    <label>المرحلة</label>
    <select id="stageSelect"><option value="">اختر الإدارة أولًا</option></select>
    <label>اسم المدرسة</label>
    <input type="text" id="newSchoolName" placeholder="اكتب اسم المدرسة كاملًا">
    <label>مادة التخصص</label>
    <select id="specSelect"><option value="">جاري التحميل...</option></select>
    <label>اسم المعلم المتعاون المقيم</label>
    <input type="text" id="newTeacherName" placeholder="اسمك بالكامل">
    <label>رقم هاتفه</label>
    <input type="tel" id="newTeacherPhone" placeholder="01xxxxxxxxx">
    <button class="primary" onclick="registerSchool()">تسجيل والحصول على الكود</button>
    <div class="msg" id="newSchoolResult"></div>
    <button class="ghost" onclick="backToChoice()">رجوع</button>
  </div>

  <div id="dashboard" class="hidden">

    <details class="box">
      <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>إضافة طالب معلم جديد</summary>
      <div style="margin-top:10px;">
        <input type="text" id="newStudentName" placeholder="اسم الطالب المعلم">
        <button class="primary" onclick="addStudent()">إضافة</button>
      </div>
    </details>

    <div id="tabAtt" class="tabPanel active">
      <h2 class="pageTitle">تسجيل الحضور</h2>
      <label>التاريخ</label>
      <input type="date" id="attDate">
      <div id="studentsList"></div>
      <button class="primary" onclick="submitAttendance()">إرسال الحضور</button>
      <p class="msg" id="doneMsgAtt"></p>
    </div>

    <div id="tabAct" class="tabPanel">
      <h2 class="pageTitle">تسجيل مشاركة</h2>
      <label>الطالب المعلم</label>
      <select id="actStudentSelect"></select>
      <label>نوع المشاركة</label>
      <select id="actType">
        <option value="حصة نُفذت">حصة نُفذت</option>
        <option value="مشاركة">مشاركة</option>
        <option value="عمل متميز">عمل متميز</option>
      </select>
      <label>التاريخ</label>
      <input type="date" id="actDate">
      <label>وصف (اختياري)</label>
      <textarea id="actDesc" rows="3"></textarea>
      <button class="primary" onclick="submitActivityForm()">تسجيل المشاركة</button>
      <p class="msg" id="doneMsgAct"></p>
    </div>

    <div id="tabProb" class="tabPanel">
      <h2 class="pageTitle">تسجيل مشكلة</h2>
      <label>الطالب المعلم</label>
      <select id="probStudentSelect"></select>
      <label>نوع المشكلة</label>
      <select id="probType">
        <option value="غياب متكرر">غياب متكرر</option>
        <option value="سلوك">سلوك</option>
        <option value="تنظيمي">تنظيمي</option>
        <option value="أخرى">أخرى</option>
      </select>
      <label>الخطورة</label>
      <select id="probSeverity">
        <option value="عادية">عادية</option>
        <option value="تحتاج تدخل فوري">تحتاج تدخل فوري</option>
      </select>
      <label>التاريخ</label>
      <input type="date" id="probDate">
      <label>وصف</label>
      <textarea id="probDesc" rows="3"></textarea>
      <button class="primary" onclick="submitProblemForm()">تسجيل المشكلة</button>
      <p class="msg" id="doneMsgProb"></p>
    </div>

    <details class="box" style="margin-bottom:8px;">
      <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>تصدير بورتفوليو المدرسة</summary>
      <div style="margin-top:10px;">
        <button class="primary" onclick="exportPortfolio()">تصدير لملف مستقل</button>
        <p class="msg" id="exportMsg"></p>
      </div>
    </details>

  </div>
</div>

<div class="tabbar hidden" id="tabbar">
  <button id="tabBtnAtt" class="active" onclick="switchTab('att')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>
    <span>الحضور</span>
  </button>
  <button id="tabBtnAct" onclick="switchTab('act')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/></svg>
    <span>المشاركات</span>
  </button>
  <button id="tabBtnProb" onclick="switchTab('prob')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>
    <span>المشاكل</span>
  </button>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxnZLhPB1FV43yG66HiZLWjhoVeRq3tTwrZy01sivFw9uM4XkNhLb4tTiyZOgJ6jcwJMw/exec';

  window.currentSchoolCode = null;

  function callApi(action, params, callback) {
    params = params || {};
    let query = 'action=' + encodeURIComponent(action);
    Object.keys(params).forEach(function (k) {
      query += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    });
    fetch(API_URL + '?' + query)
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (json.success) { callback(json.data); }
        else { alert('حدث خطأ: ' + json.error); }
      })
      .catch(function (err) {
        alert('تعذر الاتصال بالخادم، تأكد من الاتصال بالإنترنت. (' + err.message + ')');
      });
  }

  window.onload = function () {
    callApi('getAdministrations', {}, fillAdmins);
    callApi('getSpecializations', {}, fillSpecializations);

    const savedCode = localStorage.getItem('schoolCode');
    if (savedCode) {
      callApi('getSchoolByCode', {code: savedCode}, function (school) {
        if (school) { onSchoolReady(school); }
      });
    }
  };

  function logoutSchool() {
    localStorage.removeItem('schoolCode');
    window.currentSchoolCode = null;
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('tabbar').classList.add('hidden');
    document.getElementById('schoolLine').classList.add('hidden');
    document.getElementById('switchSchoolWrap').classList.add('hidden');
    document.getElementById('modeChoice').classList.remove('hidden');
  }

  function fillSpecializations(list) {
    const sel = document.getElementById('specSelect');
    sel.innerHTML = '<option value="">اختر التخصص</option>';
    list.forEach(function (s) { sel.innerHTML += '<option value="' + s + '">' + s + '</option>'; });
  }

  function showMode(mode) {
    document.getElementById('modeChoice').classList.add('hidden');
    if (mode === 'code') document.getElementById('codeMode').classList.remove('hidden');
    if (mode === 'new') document.getElementById('newMode').classList.remove('hidden');
  }

  function backToChoice() {
    document.getElementById('codeMode').classList.add('hidden');
    document.getElementById('newMode').classList.add('hidden');
    document.getElementById('codeError').innerText = '';
    document.getElementById('newSchoolResult').innerText = '';
    document.getElementById('modeChoice').classList.remove('hidden');
  }

  function fillAdmins(list) {
    const sel = document.getElementById('adminSelect');
    sel.innerHTML = '<option value="">اختر الإدارة</option>';
    list.forEach(function (a) { sel.innerHTML += '<option value="' + a.code + '">' + a.name + '</option>'; });
  }

  document.getElementById('adminSelect').addEventListener('change', function () {
    callApi('getStages', {}, fillStages);
  });

  function fillStages(list) {
    const sel = document.getElementById('stageSelect');
    sel.innerHTML = '<option value="">اختر المرحلة</option>';
    list.forEach(function (s) { sel.innerHTML += '<option value="' + s.code + '">' + s.name + '</option>'; });
  }

  function loginByCode() {
    const code = document.getElementById('schoolCodeInput').value.trim();
    document.getElementById('codeError').innerText = '';
    if (!code) { alert('اكتب كود المدرسة'); return; }
    callApi('getSchoolByCode', {code: code}, function (school) {
      if (!school) { document.getElementById('codeError').innerText = 'الكود غير صحيح، تأكد منه أو سجل مدرسة جديدة'; }
      else { onSchoolReady(school); }
    });
  }

  function registerSchool() {
    const admin = document.getElementById('adminSelect').value;
    const stage = document.getElementById('stageSelect').value;
    const name = document.getElementById('newSchoolName').value.trim();
    const specialization = document.getElementById('specSelect').value;
    const teacherName = document.getElementById('newTeacherName').value.trim();
    const teacherPhone = document.getElementById('newTeacherPhone').value.trim();
    if (!admin || !stage || !name || !specialization || !teacherName || !teacherPhone) { alert('املأ كل الحقول'); return; }
    callApi('registerNewSchool', {adminCode: admin, stageCode: stage, schoolName: name, specialization: specialization, teacherName: teacherName, teacherPhone: teacherPhone}, function (school) {
      document.getElementById('newSchoolResult').innerHTML =
        'تم التسجيل! كود مدرستك هو <b>' + school.code + '</b><br>احتفظ به لتسجيل الدخول في المرات القادمة';
      const btn = document.createElement('button');
      btn.className = 'primary';
      btn.innerText = 'متابعة للوحة المدرسة';
      btn.onclick = function () { onSchoolReady(school); };
      document.getElementById('newSchoolResult').appendChild(btn);
    });
  }

  function onSchoolReady(school) {
    window.currentSchoolCode = school.code;
    localStorage.setItem('schoolCode', school.code);
    document.getElementById('modeChoice').classList.add('hidden');
    document.getElementById('codeMode').classList.add('hidden');
    document.getElementById('newMode').classList.add('hidden');
    document.getElementById('schoolLine').textContent =
      school.name + (school.specialization ? ' - ' + school.specialization : '') + ' · كود ' + school.code;
    document.getElementById('schoolLine').classList.remove('hidden');
    document.getElementById('switchSchoolWrap').classList.remove('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('tabbar').classList.remove('hidden');

    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('attDate').value = today;
    document.getElementById('actDate').value = today;
    document.getElementById('probDate').value = today;

    loadStudents();
  }

  function loadStudents() {
    callApi('getStudentsBySchoolCode', {schoolCode: window.currentSchoolCode}, function (list) {
      fillAttendanceTable(list);
      fillStudentSelect('actStudentSelect', list);
      fillStudentSelect('probStudentSelect', list);
    });
  }

  function addStudent() {
    const name = document.getElementById('newStudentName').value.trim();
    if (!name) { alert('اكتب اسم الطالب المعلم'); return; }
    callApi('registerStudent', {schoolCode: window.currentSchoolCode, studentName: name}, function () {
      document.getElementById('newStudentName').value = '';
      loadStudents();
    });
  }

  function switchTab(tab) {
    document.getElementById('tabAtt').classList.toggle('active', tab === 'att');
    document.getElementById('tabAct').classList.toggle('active', tab === 'act');
    document.getElementById('tabProb').classList.toggle('active', tab === 'prob');
    document.getElementById('tabBtnAtt').classList.toggle('active', tab === 'att');
    document.getElementById('tabBtnAct').classList.toggle('active', tab === 'act');
    document.getElementById('tabBtnProb').classList.toggle('active', tab === 'prob');
  }

  function fillAttendanceTable(list) {
    const wrap = document.getElementById('studentsList');
    wrap.innerHTML = '';
    if (list.length === 0) {
      wrap.innerHTML = '<p class="empty">لا يوجد طلاب معلمين مسجلين على هذه المدرسة بعد — أضف أول طالب معلم من الأعلى</p>';
      return;
    }
    const statuses = ['حضور', 'غياب', 'تأخير', 'إذن'];
    list.forEach(function (st) {
      const row = document.createElement('div');
      row.className = 'studentRow';
      row.dataset.code = st.code;
      row.dataset.name = st.name;
      row.dataset.status = 'حضور';

      const nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = st.name;
      row.appendChild(nameDiv);

      const pillGroup = document.createElement('div');
      pillGroup.className = 'pillGroup';
      statuses.forEach(function (s) {
        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'pill' + (s === 'حضور' ? ' sel-حضور' : '');
        pill.textContent = s;
        pill.onclick = function () {
          row.dataset.status = s;
          pillGroup.querySelectorAll('.pill').forEach(function (p) { p.className = 'pill'; });
          pill.className = 'pill sel-' + s;
        };
        pillGroup.appendChild(pill);
      });
      row.appendChild(pillGroup);

      const noteInput = document.createElement('input');
      noteInput.type = 'text';
      noteInput.className = 'noteInput';
      noteInput.placeholder = 'ملاحظة (اختياري)';
      row.appendChild(noteInput);

      wrap.appendChild(row);
    });
  }

  function fillStudentSelect(selectId, list) {
    const sel = document.getElementById(selectId);
    sel.innerHTML = '';
    if (list.length === 0) { sel.innerHTML = '<option value="">لا يوجد طلاب معلمين بعد</option>'; return; }
    list.forEach(function (st) {
      sel.innerHTML += '<option value="' + st.code + '" data-name="' + st.name + '">' + st.name + '</option>';
    });
  }

  function submitAttendance() {
    const date = document.getElementById('attDate').value;
    if (!date) { alert('اختر التاريخ'); return; }
    const rows = document.querySelectorAll('#studentsList .studentRow');
    const records = [];
    rows.forEach(function (row) {
      records.push({
        code: row.dataset.code,
        name: row.dataset.name,
        status: row.dataset.status,
        note: row.querySelector('.noteInput').value
      });
    });
    if (records.length === 0) { alert('لا يوجد طلاب لتسجيلهم'); return; }
    callApi('submitAttendanceBatch', {date: date, records: JSON.stringify(records)}, function (res) {
      document.getElementById('doneMsgAtt').innerText = 'تم تسجيل حضور ' + res.count + ' طالب معلم بنجاح';
    });
  }

  function submitActivityForm() {
    const sel = document.getElementById('actStudentSelect');
    if (!sel.value) { alert('اختر الطالب المعلم'); return; }
    const date = document.getElementById('actDate').value;
    const type = document.getElementById('actType').value;
    const desc = document.getElementById('actDesc').value;
    const name = sel.selectedOptions[0].dataset.name;
    callApi('submitActivity', {date: date, studentCode: sel.value, studentName: name, type: type, description: desc}, function () {
      document.getElementById('doneMsgAct').innerText = 'تم تسجيل المشاركة لـ ' + name;
      document.getElementById('actDesc').value = '';
    });
  }

  function submitProblemForm() {
    const sel = document.getElementById('probStudentSelect');
    if (!sel.value) { alert('اختر الطالب المعلم'); return; }
    const date = document.getElementById('probDate').value;
    const type = document.getElementById('probType').value;
    const severity = document.getElementById('probSeverity').value;
    const desc = document.getElementById('probDesc').value;
    const name = sel.selectedOptions[0].dataset.name;
    callApi('submitProblem', {date: date, studentCode: sel.value, studentName: name, type: type, severity: severity, description: desc}, function () {
      document.getElementById('doneMsgProb').innerText = 'تم تسجيل المشكلة لـ ' + name;
      document.getElementById('probDesc').value = '';
    });
  }

  function exportPortfolio() {
    document.getElementById('exportMsg').innerText = 'جاري التصدير...';
    callApi('exportSchoolPortfolio', {schoolCode: window.currentSchoolCode}, function (res) {
      document.getElementById('exportMsg').innerHTML = 'تم إنشاء الملف: <a href="' + res.url + '" target="_blank">' + res.name + '</a>';
    });
  }
</script>
</body>
</html>
